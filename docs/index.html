<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs — Ranj UI</title>
  <meta name="description" content="Ranj UI documentation: 150+ zero-dependency components, motion effects, backgrounds and micro-interactions with live previews and copy-paste code.">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem('ranj-theme');document.documentElement.setAttribute('data-theme',t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));var a=localStorage.getItem('ranj-accent');if(a)document.documentElement.setAttribute('data-accent',a);var r=localStorage.getItem('ranj-radius');if(r)document.documentElement.setAttribute('data-radius',r)}catch(e){}</script>
  <link rel="stylesheet" href="../dist/ranj.css">
  <link rel="stylesheet" href="docs.css">
</head>
<body class="docs">
  <header class="dx-header">
    <button class="dx-icon-btn dx-menu-btn" id="dx-menu" aria-label="Open navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="dx-brand" href="../">
      <img src="../assets/logo.svg" width="26" height="26" alt="">
      <span>Ranj<b>UI</b></span>
      <span class="dx-ver">v2</span>
    </a>
    <nav class="dx-topnav">
      <a href="#/">Docs</a>
      <a href="#/c/button">Components</a>
      <a href="#/g/Motion">Motion</a>
      <a href="#/g/Backgrounds">Backgrounds</a>
      <a href="../examples/">Examples</a>
    </nav>
    <button class="dx-search" id="dx-search-btn" aria-label="Search components">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search components…</span>
      <kbd>⌘K</kbd>
    </button>
    <div class="dx-header-right">
      <button class="dx-icon-btn" id="dx-customize" aria-label="Customize theme" title="Customize theme">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.7-.8 1.7-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7h2c3.1 0 5.6-2.5 5.6-5.6C22 6 17.5 2 12 2z"/></svg>
      </button>
      <button class="dx-icon-btn" id="dx-theme" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="dx-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="dx-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="dx-icon-btn" href="https://github.com/Ralpberry-Labs/RanjUI" aria-label="GitHub" target="_blank" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>
      </a>
    </div>
  </header>

  <div class="dx-shell">
    <aside class="dx-sidebar" id="dx-sidebar">
      <div class="dx-filter"><input id="dx-filter" type="search" placeholder="Filter…" aria-label="Filter components"></div>
      <nav id="dx-nav"></nav>
    </aside>
    <div class="dx-scrim" id="dx-scrim"></div>
    <main class="dx-main" id="dx-main" tabindex="-1"></main>
    <aside class="dx-toc" id="dx-toc"></aside>
  </div>

  <!-- Search palette -->
  <div class="dx-palette" id="dx-palette" hidden>
    <div class="dx-palette-box" role="dialog" aria-modal="true" aria-label="Search">
      <div class="dx-palette-input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="dx-palette-input" placeholder="Search 150+ components…" autocomplete="off" spellcheck="false">
        <kbd>esc</kbd>
      </div>
      <div class="dx-palette-list" id="dx-palette-list" role="listbox"></div>
    </div>
  </div>

  <!-- Customizer -->
  <div class="dx-custom" id="dx-custom" hidden>
    <div class="dx-custom-head"><b>Customize</b><button class="dx-icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="dx-custom-label">Accent</div>
    <div class="dx-swatches" id="dx-accents"></div>
    <div class="dx-custom-label">Radius</div>
    <div class="dx-seg" id="dx-radius"></div>
    <div class="dx-custom-label">Mode</div>
    <div class="dx-seg" id="dx-mode"></div>
    <div class="dx-custom-label">Custom hue <span id="dx-hue-val"></span></div>
    <input type="range" min="0" max="360" id="dx-hue" class="dx-hue">
  </div>

  <script src="../dist/ranj.js"></script>
  <script src="docs-core.js"></script>
  <script src="registry.bundle.js"></script>
  <script src="docs.js"></script>
</body>
</html>
